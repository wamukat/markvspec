name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build -w @markvspec/cli

      - name: Generate docs-site content
        run: npm run sync:docs-site

      - name: Check docs links
        run: npm run check:docs-links

      - name: Audit reference docs
        run: npm run audit:docs-reference-vocabulary

      - name: Audit docs code blocks
        run: npm run audit:docs-code

      - name: Build Pages site
        run: npm run build:pages

      - name: Check dynamic-first Pages artifact gate
        run: npm run check:pages-site

      - name: Summarize dynamic-first Pages gate
        run: |
          {
            echo "## Dynamic-first showcase deploy gate"
            echo ""
            echo "- Static artifact gate: \`npm run check:pages-site\`"
            echo "- Artifact path: \`_site\`"
            echo "- Verified: dynamic runtime asset, public source assets, dependency manifests, no per-example generated HTML artifacts, dynamic-first showcase config, security boundary, and dynamic generated-document smoke checks."
            echo "- Browser regression: not run in this Pages deploy job. Run \`npm run check:showcase-browser\` during release or browser-runtime acceptance because it requires a local Chrome/Chromium binary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
