name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate, such as v0.4.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release MarkVSpec
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${TAG} does not match package version ${PACKAGE_VERSION}." >&2
            exit 1
          fi
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run release checks
        run: npm run check:release

      - name: Package VSIX
        run: npm run package:vsix -w packages/vscode-extension

      - name: Pack CLI
        run: npm pack -w @markvspec/cli --pack-destination dist

      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w @markvspec/cli --access public

      - name: Publish VS Code extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "dist/markvspec-${{ steps.version.outputs.version }}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MarkVSpec ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/markvspec-${{ steps.version.outputs.version }}.vsix
            dist/markvspec-cli-${{ steps.version.outputs.version }}.tgz
